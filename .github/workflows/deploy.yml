name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish, but skip runs queued behind it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in step with the `dioxus` version in Cargo.toml.
  DIOXUS_CLI_VERSION: 0.7.10
  # book/theme/index.hbs is based on this version's own template, so check the
  # theme still works when upgrading.
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --locked

      - name: Install mdBook
        run: cargo binstall "mdbook@${MDBOOK_VERSION}" --no-confirm --locked

      - name: Build static site
        run: ./scripts/build-site.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
